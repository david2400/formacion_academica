# Spring Boot - Permitir overriding de beans para resolver conflictos (DEBE ESTAR AL PRINCIPIO)
spring.main.allow-bean-definition-overriding=true

server.port=8081

spring.application.name=formacion_academica

# MySQL datasource (Docker compose: mysql:5.7 on localhost:3306)
spring.datasource.url=jdbc:mysql://localhost:3306/academia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Simonsito123

# Hibernate DDL - Temporal para limpiar datos corruptos de UUID
# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

# Hibernate configuración adicional
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.defer-datasource-initialization=true

# Jackson - Serialización JSON en snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.mapper.accept-case-insensitive-properties=true
spring.jackson.deserialization.fail-on-unknown-properties=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
# ─── Motor de estados ───────────────────────────────────────────────────────
# El ciclo de vida de las entidades lo gobierna el motor de máquinas de estados
# de access_control. Las columnas estado_id de este proyecto son una réplica de
# lo que decide el motor, para poder listar y filtrar sin salir a la red.
#
# DEPENDENCIA EN RUNTIME: crear o cambiar de estado una inscripción, matrícula,
# grupo, asignación a grupo o vínculo con acudiente requiere que access_control
# responda. Si está caído, esas escrituras fallan.
motor-estados.base-url=http://localhost:8000/api/access_control
# Cortos a propósito: se invocan dentro de transacciones de escritura.
motor-estados.connect-timeout=3s
motor-estados.read-timeout=5s
# Una máquina publicada es inmutable; esto acota cuánto se tarda en ver una
# versión nueva sin convertir cada creación en una llamada remota.
motor-estados.cache-ttl=10m
