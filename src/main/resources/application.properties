# Secretos: llegan por variables de entorno o, en desarrollo, por config/local-secrets.properties (gitignored).
spring.config.import=optional:file:./config/local-secrets.properties

# Spring Boot - Permitir overriding de beans para resolver conflictos (DEBE ESTAR AL PRINCIPIO)
spring.main.allow-bean-definition-overriding=true

server.port=8081

spring.application.name=formacion_academica

# MySQL datasource (Docker compose: mysql:5.7 on localhost:3306)
spring.datasource.url=jdbc:mysql://localhost:3306/academia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Hibernate DDL - Temporal para que Hibernate agregue usuario_id/empresa_id/password
# a acudientes y estudiantes (columnas nuevas, no destructivo). Volver a comentar
# esta linea una vez que arranque bien y se confirme que las columnas quedaron creadas.
spring.jpa.hibernate.ddl-auto=update

# Hibernate configuración adicional
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.defer-datasource-initialization=true

# Jackson - Serialización JSON en snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.mapper.accept-case-insensitive-properties=true
spring.jackson.deserialization.fail-on-unknown-properties=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
# ─── Motor de estados ───────────────────────────────────────────────────────
# El ciclo de vida de las entidades lo define el motor de máquinas de estados de
# access_control, pero se accede POR SQL DIRECTO a su esquema, no por su API:
# ambos están en el mismo servidor MySQL.
#
# Consecuencias:
#   - NO hace falta que la aplicación access_control esté arriba. Solo MySQL.
#   - Los cambios en ambos esquemas van en la MISMA transacción y conexión, así
#     que no pueden quedar descuadrados.
#   - A cambio, esto depende del ESQUEMA del motor (proyecto parametros): se lee directo de sus
#     tablas (sin vistas intermedias), así que un ALTER allí puede romper
#     MotorEstadosJdbcAdapter.
#
# El usuario del datasource necesita SELECT sobre parametros.state_machine, state_machine_state,
# entity_type, state_transition, action y transition_rule, e INSERT/UPDATE sobre
# parametros.state_machine_instance y parametros.state_transition_history.
motor-estados.esquema=parametros

# ─── Identidad centralizada (User/Client/UserCompany de access_control) ────
# gestion_alumnos lee la identidad de acudientes/estudiantes por SQL directo
# contra el esquema de access_control (mismo servidor MySQL, mismo mecanismo
# que motor-estados.esquema arriba): la vista vw_account_usuario para
# identidad (User + Client), y la tabla UserCompany directamente para validar
# la asignación a empresa (sin vista intermedia: ver CuentaUsuarioJdbcAdapter).
access-control.esquema=security

# ─── JWT propio de Estudiante/Acudiente (Etapa 5B) ─────────────────────────
# Usa el mismo JWT_SECRET que access_control. Lo que separa ambos tokens es el
# emisor (iss): cada validador exige el suyo, asi que un token de estudiante no
# pasa como token de personal ni al reves. Transitorio hasta el emisor central.
gestion-alumnos.jwt.secret=${JWT_SECRET}
gestion-alumnos.jwt.access-token-expiration=PT12H
gestion-alumnos.jwt.issuer=formacion-academica-gestion-alumnos

# ─── Tokens de access_control (personal: docentes, coordinación, administración) ─
# formacion_academica VALIDA (no emite) el token de access_control con la librería
# essenza-security: RS256 del servidor de autorización (JWKS) y, mientras dure la
# transición, el HMAC viejo firmado con JWT_SECRET. audiences = código de esta
# aplicación en access_control (nombre de Applications en minúsculas, sin tildes, con guiones).
essenza.security.issuer=${ACCESS_CONTROL_OAUTH2_ISSUER:http://localhost:8000}
essenza.security.jwks-uri=${ACCESS_CONTROL_JWKS_URI:}
essenza.security.audiences=${FORMACION_OAUTH2_AUDIENCES:formacion-academica}
essenza.security.accept-legacy=${FORMACION_ACCEPT_LEGACY_TOKENS:true}
essenza.security.legacy-secret=${JWT_SECRET}
essenza.security.legacy-issuer=access-control-service
# Modo observacion: false = no bloquea, solo registra en el log las rutas llamadas sin token.
essenza.security.enforce-authentication=${FORMACION_ENFORCE_AUTH:true}
# Rutas publicas extra (patrones Ant separados por coma). El login de estudiantes/acudientes ya es publico.
essenza.security.rutas-publicas=${FORMACION_RUTAS_PUBLICAS:}
essenza.security.rutas-publicas-get=${FORMACION_RUTAS_PUBLICAS_GET:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ─── Feedback de clases: roles ────────────────────────────────────────────────
# Códigos de rol de access_control (claim "roles"). Ajustar si allá se llaman distinto.
feedback.seguridad.roles-administracion=ADMINISTRADOR,COORDINADOR
feedback.seguridad.roles-docente=DOCENTE
# Qué identificador del token es clase_profesores.profesor_id: USER_ID (sub) o EMPLOYEE_ID.
feedback.seguridad.identificador-docente=USER_ID

# Mientras dure el modo observacion: muestra POR QUE se rechaza un token de access_control
# ("Token de access_control no valido: ..."). Volver a INFO al activar FORMACION_ENFORCE_AUTH.
logging.level.com.kleverkids.formacion_academica.security.accesscontrol=${FORMACION_LOG_TOKENS:DEBUG}
